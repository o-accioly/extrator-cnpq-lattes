# CI do Extrator CNPq Lattes: testes, executáveis Windows (.exe) e Linux, changelog e release.
#
# Fluxo: branches de trabalho -> PR para `homolog` -> PR `homolog` -> `main`.
#   - PR e push em homolog/main: fragmento towncrier (em PR), testes, os dois executáveis e o
#     instalador Windows (artefatos do workflow por 7 dias);
#   - push na `main` com fragmentos pendentes em changelog.d/: a versão sobe sozinha
#     (removal = major, feature = minor, demais = patch), o towncrier escreve o CHANGELOG.md,
#     sai a tag vX.Y.Z, a Release com os executáveis e o back-merge main -> homolog.
#
# Onde roda: runners do GitHub. Com a variável do repositório USAR_RUNNER_PROPRIO=true, testes e
# executável Linux vão para o runner self-hosted (deploy/ci-runner, label lattes-ci). O .exe fica
# sempre num Windows do GitHub: o PySide6 atual não carrega no Wine.
name: CI

on:
  push:
    branches: [main, homolog]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  versao:
    name: Versão e changelog
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      liberar: ${{ steps.v.outputs.liberar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar towncrier
        run: pip install -q "$(grep -E '^towncrier==' requirements-dev.txt)"
      - name: Fragmento towncrier no PR
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${GITHUB_BASE_REF}"
          codigo="$(git diff --name-only "$base"...HEAD -- 'lattes_extrator/*.py' 'lattes_extrator/**/*.py' main.py || true)"
          frag="$(git diff --name-only --diff-filter=A "$base"...HEAD -- 'changelog.d/*.md' | grep -v '_template.md' || true)"
          if [[ -n "$codigo" && -z "$frag" && "$GITHUB_HEAD_REF" != "homolog" ]]; then
            echo "::error::Código do programa mudou sem fragmento em changelog.d/ (ver .claude/rules/towncrier.md)."
            echo "$codigo"
            exit 1
          fi
          echo "Fragmentos: ${frag:-nenhum}"
      - name: Calcular versão
        id: v
        run: |
          atual="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          proxima="$(python ci/versao.py "$atual")"
          liberar=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && -n "$proxima" ]]; then
            liberar=true
            versao="$proxima"
          else
            base="${atual#v}"
            [[ -n "$base" ]] || base="$(python -c "import re;print(re.search(r'__version__ = \"(\d+\.\d+\.\d+)', open('lattes_extrator/__init__.py').read()).group(1))")"
            versao="${base}-dev.${GITHUB_SHA::7}"
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "liberar=$liberar" >> "$GITHUB_OUTPUT"
          echo "Última tag: ${atual:-nenhuma} · build: $versao · release: $liberar" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "$proxima" ]]; then
            { echo; echo "### Changelog pendente (v${proxima})"; towncrier build --draft --version "$proxima" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          fi

  linux:
    name: Testes + Linux
    needs: versao
    runs-on: ${{ vars.USAR_RUNNER_PROPRIO == 'true' && fromJSON('["self-hosted","lattes-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas do Qt (runner do GitHub)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libegl1 libopengl0 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxshmfence1 libgbm1 libasound2t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbfile1 fonts-dejavu-core >/dev/null
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Testes, executável Linux e teste do executável
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: ci/build_linux.sh "${{ needs.versao.outputs.versao }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist-ci/*linux-x64.tar.gz
            dist-ci/teste-visualizador-linux.png
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows (.exe)
    needs: versao
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Gerar e testar o ExtratorLattes.exe
        run: ci/build_windows.sh "${{ needs.versao.outputs.versao }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist-ci/*windows-x64.zip
            dist-ci/*-setup.exe
            dist-ci/teste-visualizador-windows.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Release
    needs: [versao, linux, windows]
    if: needs.versao.outputs.liberar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar towncrier
        run: pip install -q "$(grep -E '^towncrier==' requirements-dev.txt)"
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: CHANGELOG, versão, tag e Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          tag="v${VERSAO}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          towncrier build --draft --version "$VERSAO" > notas.md
          towncrier build --version "$VERSAO" --yes
          ci/definir_versao.sh "$VERSAO"
          git add -A CHANGELOG.md changelog.d lattes_extrator/__init__.py
          git commit -m "chore: release ${tag} [skip ci]"
          git tag -a "$tag" -m "Extrator CNPq Lattes ${tag}"
          git push origin "HEAD:main" "$tag"
          gh release create "$tag" --title "Extrator CNPq Lattes ${tag}" --notes-file notas.md \
            artefatos/*-setup.exe artefatos/*.zip artefatos/*.tar.gz
          echo "Release ${tag} publicada." >> "$GITHUB_STEP_SUMMARY"
      - name: Back-merge main -> homolog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.versao }}
        run: |
          git fetch origin homolog
          git checkout -B homolog origin/homolog
          if git merge --no-edit main -m "chore: back-merge v${VERSAO} [skip ci]"; then
            git push origin homolog
          else
            git merge --abort
            gh pr create --base homolog --head main --title "chore: back-merge v${VERSAO}" \
              --body "Back-merge automático da release v${VERSAO} com conflito: resolver à mão."
          fi
