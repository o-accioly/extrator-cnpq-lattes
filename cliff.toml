# git-cliff: gera o CHANGELOG.md e decide a próxima versão a partir dos commits.
# Commits no padrão Conventional Commits (ver docs/ci.md):
#   feat: ...        -> nova versão minor (2.0.0 -> 2.1.0)
#   fix: / perf: ... -> nova versão patch  (2.1.0 -> 2.1.1)
#   feat!: ... ou "BREAKING CHANGE:" no corpo -> nova versão major
#   chore/docs/ci/test/refactor/style -> entram no changelog, mas sozinhos não geram versão

[changelog]
header = """
# Changelog

Todas as mudanças relevantes do Extrator CNPq Lattes. Gerado automaticamente a partir dos commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%d/%m/%Y") }}
{% else %}\
## [Não lançado]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**[QUEBRA COMPATIBILIDADE]** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Novidades" },
  { message = "^fix", group = "<!-- 1 -->Correções" },
  { message = "^perf", group = "<!-- 2 -->Desempenho" },
  { message = "^refactor", group = "<!-- 3 -->Refatoração" },
  { message = "^docs", group = "<!-- 4 -->Documentação" },
  { message = "^(ci|build)", group = "<!-- 5 -->CI e build" },
  { message = "^test", group = "<!-- 6 -->Testes" },
  { message = "^style", group = "<!-- 7 -->Visual" },
  { message = "^chore", group = "<!-- 8 -->Manutenção" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v2.0.0"
