# Runner self-hosted do CI do Extrator CNPq Lattes (ver docs/ci.md).
#
# Feito para rodar num servidor que também tem outros serviços, sem disputar com eles:
#   - cpu_shares 256 (produção usa o padrão, 1024): sob disputa de CPU, produção ganha 4 para 1;
#   - teto de CPU/RAM por container;
#   - a pasta de trabalho do job vive em RAM (tmpfs); o único volume em disco é o cache do pip.
# Um slot basta: testes + executável Linux levam poucos minutos (o .exe é feito num Windows do GitHub).
#
# Variáveis de ambiente do deploy: GITHUB_RUNNER_PAT (obrigatória), GITHUB_REPOSITORY (opcional).
x-ci-logging: &ci-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  lattes-runner-1:
    build:
      context: ../..
      dockerfile: deploy/ci-runner/Dockerfile
    image: lattes-ci-runner:2.338.1-py3.12
    restart: unless-stopped
    logging: *ci-logging
    stop_grace_period: 30s
    cpus: 8
    mem_limit: 12g
    memswap_limit: 12g
    cpu_shares: 256
    pids_limit: 4096
    security_opt:
      - no-new-privileges:true
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-o-accioly/extrator-cnpq-lattes}
      GITHUB_RUNNER_PAT: ${GITHUB_RUNNER_PAT:?defina GITHUB_RUNNER_PAT}
      RUNNER_LABELS: lattes-ci
      RUNNER_SLOT: "1"
    tmpfs:
      # venv, build/ e dist/ do executável Linux (~2 GB)
      - /home/runner/_work:size=6g,exec
    volumes:
      - ci-cache:/home/runner/cache
    networks:
      - ci

networks:
  ci:
    # Sub-rede fixa: evita esgotar o pool automático de redes do Docker em hosts com muitos composes.
    ipam:
      config:
        - subnet: 10.251.70.0/24

volumes:
  ci-cache: {}
